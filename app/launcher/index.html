<style>
/* Layout: glass icon rail with a sliding pill (bottom bar on phones). Intro cutscene (warp-speed asset loader) then Home (parallax aurora hero), Profile (single 1.21.11 install with browser for mods, modpacks, resource packs, shaders from Modrinth or CurseForge), Settings. HUD editing happens in game with Right Shift. */
:root{
  --bg:#06060b;--surf:#0e0e19;--surf2:#161625;--surf3:#1f1f33;
  --line:rgba(255,255,255,.08);--tx:#f3f3fb;--mu:#8b8ba8;
  --acc:#7c5cff;--acc2:#29d3f0;--ok:#3ddc97;--bad:#ff5d73;
  --display:'Chakra Petch','Arial Narrow',sans-serif;--body:'Manrope',system-ui,sans-serif;
  --spring:cubic-bezier(.3,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:14px;line-height:1.5}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mu{color:var(--mu)}
.app{display:grid;grid-template-columns:92px minmax(0,1fr);min-height:100vh;position:relative;z-index:1}
.nav{position:sticky;top:0;height:100vh;background:rgba(14,14,25,.9);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;z-index:20}
.ind{position:absolute;left:0;top:0;border-radius:16px;background:var(--surf3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 24px -4px var(--acc);transition:transform .5s var(--spring),width .5s var(--spring),height .5s var(--spring);pointer-events:none;z-index:0}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(160deg,#1b1838,#07070f);border:2px solid color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 22px -4px var(--acc);display:grid;place-items:center;font:700 23px var(--display);margin-bottom:20px;color:#fff;padding:6px;transition:background .4s;position:relative;z-index:1;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px) rotate(-3deg)}}
.sform{display:grid;grid-template-columns:1fr 1.5fr auto;gap:10px;margin-bottom:20px}
.sform input,.ta{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--tx);font:500 15px var(--body);min-width:0;width:100%}
.sform input:focus,.ta:focus{outline:2px solid var(--acc);border-color:transparent}
.ta{min-height:96px;resize:vertical;font:500 12px/1.5 ui-monospace,monospace;margin-top:10px}
.sv{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surf);margin-bottom:12px;transition:transform .25s,border-color .25s}
.sv:hover{border-color:var(--acc);transform:translateY(-2px)}
.sv .si{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font:700 22px var(--display);color:#fff;flex:none}
.sv .sm{flex:1;min-width:0}.sv .sm b{display:block;font-size:17px;overflow-wrap:anywhere}.sv .sm small{color:var(--mu);font:500 13px ui-monospace,monospace;overflow-wrap:anywhere}
.sv button,.sbtn{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);color:var(--tx);font:700 13px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .2s,border-color .2s}
.sv button:hover,.sbtn:hover{border-color:var(--acc);transform:translateY(-1px)}
.sv .jn{background:linear-gradient(120deg,var(--acc),var(--acc2));border:0}
.sv .i{width:16px;height:16px}
.empty{padding:34px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--mu)}
.jv{display:block;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font:500 11px/1.5 ui-monospace,monospace;color:var(--acc2);overflow-wrap:anywhere}
.rm.dup{margin-right:8px}
@media(max-width:700px){.sform{grid-template-columns:1fr}.sv{flex-wrap:wrap}.sv .sm{flex-basis:calc(100% - 70px)}}
.nb{width:64px;padding:11px 0 8px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mu);font-size:10px;font-weight:700;letter-spacing:.06em;transition:color .25s,transform .2s;position:relative;z-index:1;overflow:hidden}
.nb svg{transition:transform .4s var(--spring)}
.nb:hover{color:var(--tx)}.nb:hover svg{transform:translateY(-2px) scale(1.12)}
.nb.on{color:#fff}.nb.on svg{color:var(--acc2)}
.nb:active{transform:scale(.94)}
.sp{flex:1}
.acct{width:46px;height:46px;border-radius:50%;background:var(--surf3);display:grid;place-items:center;font:600 17px var(--display);position:relative;z-index:1}
.acct::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--surf);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(61,220,151,.2)}}
.main{min-width:0;padding-block:20px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.page{max-width:1040px;margin:0 auto}
.st{animation:rise .7s var(--out) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
h1{font:700 30px/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:600 17px var(--display);margin:0;letter-spacing:.02em}
.sub{color:var(--mu);margin:4px 0 0}
.eyebrow{font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--acc2)}
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:470px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .big{font:700 clamp(54px,15vw,112px)/.92 var(--display);letter-spacing:.03em;margin:8px 0 8px;text-shadow:0 8px 40px rgba(0,0,0,.5)}
.hero .big span,.iname span{display:inline-block;animation:letter .9s var(--spring) both;animation-delay:calc(var(--k)*60ms + 200ms)}
@keyframes letter{from{opacity:0;transform:translateY(40px) rotate(8deg)}to{opacity:1;transform:none}}
.hero .meta{color:#c9c9e2;margin:0 0 20px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;padding:10px;background:rgba(10,10,22,.55);border:1px solid rgba(255,255,255,.1);border-radius:22px;backdrop-filter:blur(14px)}
.ver{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:60px;flex:1 1 180px}
.ver .ico{width:42px;height:42px;border-radius:13px;background:var(--acc);display:grid;place-items:center;font:700 18px var(--display);transition:background .4s}
.ver b{font:700 19px var(--display);display:block;line-height:1.1}.ver small{color:var(--mu);font-size:12px}
.play{flex:1 1 220px;min-height:60px;border-radius:16px;background:var(--acc);color:#fff;font:700 20px var(--display);letter-spacing:.1em;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;transition:transform .25s var(--spring),box-shadow .3s,background .4s;box-shadow:0 10px 30px -8px var(--acc);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 14px 44px -6px var(--acc2)}}
.play:hover{transform:translateY(-3px) scale(1.02)}.play:active{transform:scale(.96)}
.play::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-80px}100%{left:120%}}
.play svg,.play span{position:relative}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%) scale(0);animation:rp .6s ease-out forwards;pointer-events:none;width:40px;height:40px}
@keyframes rp{to{transform:translate(-50%,-50%) scale(8);opacity:0}}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 28px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.tile b{display:block;font:700 28px var(--display)}.tile small{color:var(--mu);font-size:12px}
.tile::before{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:var(--acc);opacity:.18;transition:background .4s}
.sec{margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec small{color:var(--mu)}
.news{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;margin:0 -2px}
.nw{flex:0 0 min(300px,80%);scroll-snap-align:start;border-radius:20px;border:1px solid var(--line);background:var(--surf);overflow:hidden;transition:transform .25s var(--out),border-color .3s;will-change:transform;position:relative}
.nw:hover{border-color:rgba(255,255,255,.2)}
.nw .art{height:110px;position:relative;overflow:hidden}
.nw .art i{position:absolute;border-radius:50%;animation:drift 8s ease-in-out infinite}
@keyframes drift{50%{transform:translate(14px,10px) scale(1.1)}}
.nw .body{padding:16px}.nw p{margin:6px 0 0;color:var(--mu);font-size:13px}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.14),transparent 55%);opacity:0;transition:opacity .3s}
.nw:hover .glare,.feat:hover .glare{opacity:1}
.tag{display:inline-block;font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.1)}
.feat{display:flex;align-items:center;gap:16px;padding:18px;border-radius:22px;background:var(--surf2);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;width:100%;text-align:left;transition:transform .25s var(--out)}
.feat .ficon{width:56px;height:56px;border-radius:17px;background:var(--acc);display:grid;place-items:center;flex-shrink:0;transition:background .4s;animation:float 4s ease-in-out infinite}
.feat p{margin:2px 0 0;color:var(--mu)}
.feat .go{margin-left:auto;color:var(--acc2);transition:transform .3s var(--spring)}
.feat:hover .go{transform:translateX(6px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);background:rgba(61,220,151,.12);padding:5px 10px;border-radius:9px}
/* profile */
.pcard{background:var(--surf2);border:1px solid var(--line);border-radius:22px;padding:18px;position:relative;overflow:hidden;display:grid;gap:14px;margin-bottom:18px}
.pcard::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--acc);opacity:.16;transition:background .4s;pointer-events:none}
.pcard>*{position:relative;z-index:1}
.prow{display:flex;align-items:center;gap:14px;min-width:0}
.pic{width:54px;height:54px;border-radius:16px;background:var(--acc);display:grid;place-items:center;font:700 24px var(--display);flex-shrink:0;transition:background .4s}
.tip{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:15px;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.25)}
.tip b{display:block;font-weight:600}.tip small{color:var(--mu);display:block}
.key{font:700 11px var(--display);padding:4px 9px;border-radius:8px;background:var(--surf3);color:#cfcfe8;letter-spacing:.05em;white-space:nowrap}
.kc{padding:8px 12px;box-shadow:0 3px 0 rgba(255,255,255,.25);animation:press 2s infinite;flex-shrink:0}
@keyframes press{0%,60%,100%{transform:translateY(0);box-shadow:0 3px 0 rgba(255,255,255,.25)}70%{transform:translateY(3px);box-shadow:0 0 0 rgba(255,255,255,.25)}}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;padding:5px;background:var(--surf);border:1px solid var(--line);border-radius:18px;margin-bottom:14px}
.tabs button{position:relative;z-index:1;flex:1 0 auto;padding:11px 16px;border-radius:13px;font-weight:700;font-size:13px;color:var(--mu);white-space:nowrap;transition:color .25s}
.tabs button.on{color:#fff}
.tind{position:absolute;left:0;top:5px;bottom:5px;border-radius:13px;background:var(--surf3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 22px -6px var(--acc);transition:transform .5s var(--spring),width .5s var(--spring);z-index:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;position:relative;z-index:20}
.srch{position:relative;flex:1 1 220px;min-width:0}
.srch svg{position:absolute;left:14px;top:13px;color:var(--mu)}
.srch input{width:100%;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--surf);color:var(--tx);padding:0 14px 0 44px;font:inherit;transition:border-color .2s}
.srch input:focus{border-color:var(--acc);outline:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:12px;background:var(--surf2);font-weight:600;font-size:13px;color:var(--mu);transition:all .25s var(--spring)}
.seg button.on{background:var(--acc);color:#fff;transform:scale(1.04)}
.seg button[data-src="m"].on{background:#1bd96a;color:#052b14}
.seg button[data-src="c"].on{background:#f16436;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chips button{padding:8px 15px;border-radius:20px;background:var(--surf);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mu);white-space:nowrap;transition:all .25s var(--spring)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;min-height:120px}
.bc{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .25s var(--out),border-color .25s,background .25s}
.bc:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);background:var(--surf2)}
.bc .top{display:flex;gap:12px;align-items:center;min-width:0}
.bc .top>div:nth-child(2){min-width:0;flex:1}
.bc b{display:block;font:600 15px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc small{color:var(--mu)}
.bc p{margin:0;color:var(--mu);font-size:13px;flex:1}
.bc .f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:700 20px var(--display);color:#fff;flex-shrink:0}
.src{display:inline-block;font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:8px}
.bc .ti,.mrow .ti{overflow:hidden}.mrow .ti img{width:100%;height:100%;object-fit:cover;display:block}.bc .ti img{width:100%;height:100%;object-fit:cover;display:block}a.src{text-decoration:none;transition:filter .2s,transform .2s}a.src:hover{filter:brightness(1.3);transform:translateY(-1px)}
.src.m{background:rgba(27,217,106,.14);color:#3ddc97}
.src.c{background:rgba(241,100,54,.16);color:#ff9a5c}
.ib{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:112px;padding:9px 14px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;transition:transform .25s var(--spring),filter .2s,background .3s}
.ib:hover{filter:brightness(1.12)}.ib:active{transform:scale(.95)}
.ib.done{background:rgba(61,220,151,.15);color:var(--ok)}
.ib .pb{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc2);opacity:.6}
.ib>*:not(.pb){position:relative}
.sk{height:150px;border-radius:18px;background:linear-gradient(100deg,var(--surf) 30%,var(--surf2) 50%,var(--surf) 70%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{color:var(--mu);grid-column:1/-1;margin:20px 0;text-align:center}
.res{color:var(--mu);font-size:12px;font-weight:600;margin:0 2px 10px;letter-spacing:.04em}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:20px 0 6px}
.pgb{min-width:42px;height:42px;padding:0 8px;border-radius:13px;background:var(--surf);border:1px solid var(--line);font:700 14px var(--display);color:var(--mu);display:grid;place-items:center;transition:all .25s var(--spring)}
.pgb:hover{color:#fff;transform:translateY(-2px);border-color:rgba(255,255,255,.2)}
.pgb:active{transform:scale(.92)}
.pgb.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.08);box-shadow:0 8px 20px -8px var(--acc)}
.pgb:disabled{opacity:.3;cursor:default;transform:none}
.pgb svg.pv{transform:scaleX(-1)}
.dots{display:grid;place-items:center;width:26px;color:var(--mu);font-weight:700}
.note{color:var(--mu);font-size:12px;margin:12px 2px 0}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--surf);border:1px solid var(--line);border-radius:15px;min-width:0;transition:transform .25s var(--out),border-color .25s,background .25s}
.mrow:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18);background:var(--surf2)}
.mrow .mi{display:flex;gap:12px;align-items:center;min-width:0}
.mrow .mi>div:last-child{min-width:0}
.mrow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow small{color:var(--mu);display:block;font-size:12px}
.mrow .ti{width:38px;height:38px;border-radius:12px;font-size:16px}
.rm{padding:7px 12px;border-radius:10px;background:rgba(255,93,115,.14);color:var(--bad);font-weight:700;font-size:12px;transition:transform .2s var(--spring)}
.rm:hover{transform:scale(1.06)}
.swc{width:46px;height:28px;border-radius:14px;background:var(--surf3);position:relative;flex-shrink:0;transition:background .25s}
.swc::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .35s var(--spring),width .2s}
.swc:active::after{width:28px}
.swc.on{background:var(--acc)}.swc.on::after{transform:translateX(18px)}.swc.on:active::after{transform:translateX(12px)}
.set{display:grid;gap:10px;max-width:660px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 16px;background:var(--surf);border:1px solid var(--line);border-radius:16px}
.sr small{color:var(--mu);display:block}
.swatch{display:flex;gap:12px;flex-wrap:wrap;padding:2px 4px 6px}
.swatch button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;transition:transform .35s var(--spring),border-color .2s}
.swatch button:hover{transform:scale(1.15)}
.swatch button.on{border-color:#fff;transform:scale(1.18)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--surf3);border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-weight:600;z-index:70;pointer-events:none;transition:all .4s var(--spring);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,5,10,.82);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px}

@keyframes fade{from{opacity:0}}
.ring{position:relative;width:170px;height:170px;animation:pop .6s var(--spring)}

.ring svg{width:100%;height:100%;transform:rotate(-90deg)}

.lc{width:min(560px,100%);background:linear-gradient(160deg,rgba(30,28,50,.96),rgba(12,12,22,.96));border:1px solid var(--bd,rgba(255,255,255,.1));border-radius:26px;padding:24px;box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 90px rgba(124,92,255,.18);animation:pop .55s var(--spring);position:relative;overflow:hidden}
.lc:before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:conic-gradient(from var(--ang,0deg),transparent 0 70%,var(--acc2) 85%,transparent);opacity:.35;-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);padding:1px;animation:lspin 3s linear infinite;pointer-events:none}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes lspin{to{--ang:360deg}}
.lh{display:flex;align-items:center;gap:14px}.lt{flex:1;min-width:0}
.logo svg,.lg-logo svg{width:100%;height:100%;fill:none}
.lbadge{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font:800 26px var(--display);box-shadow:0 0 34px rgba(124,92,255,.5);animation:lpulse 1.6s ease-in-out infinite}
@keyframes lpulse{50%{transform:scale(1.07)}}
.lc h2{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lc p{font-size:13px}
.lpct{font:800 30px var(--display);font-variant-numeric:tabular-nums}
.lbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);margin:18px 0 14px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--acc),var(--acc2));position:relative;box-shadow:0 0 18px var(--acc)}
.lbar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:lshine 1.1s linear infinite}
@keyframes lshine{to{transform:translateX(100%)}}
.lsteps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lsteps li{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;font-size:14px;font-weight:600;color:var(--mu);opacity:.45;transform:translateX(-10px);transition:opacity .35s,transform .4s var(--spring),background .3s,color .3s}
.lsteps li.act{opacity:1;transform:none;color:#fff;background:rgba(255,255,255,.06)}
.lsteps li.done{opacity:1;transform:none;color:#cfd0e6}
.lsteps li>span:nth-child(2){flex:1;text-align:left}.lsteps li b{margin-left:auto;font:600 12px ui-monospace,Menlo,monospace;color:var(--mu)}
.lsteps li.done b{color:var(--ok)}
.lsteps .ic{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;flex-shrink:0;transition:all .3s}
.lsteps li.act .ic{border-color:rgba(255,255,255,.15);border-top-color:var(--acc2);animation:lrot .7s linear infinite}
.lsteps li.done .ic{background:var(--ok);border-color:var(--ok);animation:lpop .4s var(--spring)}
.lsteps .ic svg{width:12px;height:12px;color:#06140d;opacity:0}.lsteps li.done .ic svg{opacity:1}
@keyframes lrot{to{transform:rotate(360deg)}}@keyframes lpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.llog{margin-top:12px;height:74px;overflow:hidden;border-radius:12px;background:rgba(0,0,0,.35);padding:9px 12px;font:11.5px/1.55 ui-monospace,Menlo,monospace;color:#7f81a3;display:flex;flex-direction:column;justify-content:flex-end}
.llog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fade .25s}.llog em{color:var(--acc2);font-style:normal}
.lc .okb{width:100%;margin-top:14px}
.lc.fin .lbadge{background:var(--ok);animation:none}

.bc,.tile,.pcard,.opt,.mrow{--mx:50%;--my:50%}
.bc:after,.tile:after,.opt:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,255,255,.09),transparent 60%);transition:opacity .3s}
.bc:hover:after,.tile:hover:after,.opt:hover:after{opacity:1}
.bc{position:relative}
.bc:hover{border-color:rgba(255,255,255,.2)}
.play:before{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:pshine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes pshine{0%,55%{left:-80px}100%{left:120%}}
.mrow.new{animation:rowflash 1.2s ease}
@keyframes rowflash{0%{background:rgba(61,220,151,.28);transform:translateX(-14px);opacity:0}30%{opacity:1;transform:none}100%{background:transparent}}

/* ===== premium browser ===== */
.srch.big{flex:1 1 280px}

.srch.big input{height:52px;border-radius:18px;padding:0 54px 0 50px;font-size:15px;font-weight:500;background:linear-gradient(180deg,var(--surf2),var(--surf));box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:border-color .25s,box-shadow .35s,transform .3s var(--spring)}
.srch.big input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent),0 14px 40px -16px var(--acc);transform:translateY(-1px)}
.srch kbd{position:absolute;right:14px;top:14px;height:24px;min-width:24px;padding:0 7px;border-radius:8px;border:1px solid var(--line);background:var(--surf3);font:700 12px/22px var(--display);color:var(--mu);text-align:center;pointer-events:none;transition:opacity .2s}
.srch input:focus~kbd{opacity:0}
.ddw{position:relative}
.dd{height:52px;padding:0 16px 0 14px;border-radius:18px;background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--line);display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;color:var(--tx);transition:border-color .25s,transform .3s var(--spring),box-shadow .3s}
.dd:hover{border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.dd svg{width:18px;height:18px;color:var(--acc2)}
.dd .cv{transition:transform .35s var(--spring);color:var(--mu)}
.ddw.open .dd{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.ddw.open .dd .cv{transform:rotate(180deg)}
.dd i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);display:none}
.dd.act i{display:block}
.ddm{position:absolute;right:0;top:calc(100% + 10px);width:250px;padding:8px;border-radius:20px;background:linear-gradient(180deg,var(--surf3),var(--surf2));border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px -20px rgba(0,0,0,.9);opacity:0;transform:translateY(-10px) scale(.96);transform-origin:90% 0;pointer-events:none;transition:opacity .22s,transform .35s var(--spring);z-index:30}
.ddw.open .ddm{opacity:1;transform:none;pointer-events:auto}

.ddm button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--tx);transition:background .2s,transform .25s var(--spring)}
.ddm button:hover{background:rgba(255,255,255,.07);transform:translateX(3px)}
.ddm button svg{width:16px;height:16px;color:var(--acc2);opacity:0;transform:scale(.4);transition:all .3s var(--spring)}
.ddm button.on{color:#fff}.ddm button.on svg{opacity:1;transform:none}
.ctabs{position:relative;display:flex;gap:2px;overflow-x:auto;padding:5px;background:var(--surf);border:1px solid var(--line);border-radius:18px;margin-bottom:14px;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{position:relative;z-index:1;flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:13px;font-weight:700;font-size:13px;color:var(--mu);white-space:nowrap;transition:color .25s}
.ctabs button:hover{color:var(--tx)}.ctabs button.on{color:#fff}
.ctabs .n{padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.07);font-size:11px;font-weight:700;transition:background .3s}
.ctabs button.on .n{background:var(--acc)}
.ctabs .tind{background:linear-gradient(135deg,var(--surf3),var(--surf2))}
.bc{border-radius:20px;padding:16px;gap:12px;background:linear-gradient(165deg,var(--surf2),var(--surf));overflow:hidden;transition:transform .4s var(--out),box-shadow .4s,border-color .3s}
.bc:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--acc),transparent 42%,var(--acc2));-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .4s;pointer-events:none}
.bc:hover{transform:translateY(-6px);box-shadow:0 26px 56px -22px rgba(0,0,0,.85),0 0 44px -16px var(--acc)}
.bc:hover:before{opacity:1}
.bc.st{animation-fill-mode:backwards;animation-delay:calc(var(--i,0)*45ms)}
.bc .ti{width:58px;height:58px;border-radius:16px;box-shadow:0 8px 22px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.1);transition:transform .5s var(--spring)}
.bc:hover .ti{transform:scale(1.1) rotate(-5deg)}
.bc b{font-size:16px}
.mlogo{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.ib{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 24px -10px var(--acc),inset 0 1px 0 rgba(255,255,255,.25);padding:10px 16px;border-radius:13px;transition:transform .3s var(--spring),box-shadow .3s,filter .2s}
.ib:before{content:"";position:absolute;top:0;bottom:0;width:46px;left:-70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s var(--out)}
.ib:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 16px 32px -10px var(--acc),inset 0 1px 0 rgba(255,255,255,.3)}
.ib:hover:before{left:120%}
.ib:active{transform:translateY(0) scale(.95)}
.ib.done{background:rgba(61,220,151,.14);box-shadow:inset 0 0 0 1px rgba(61,220,151,.35);color:var(--ok)}
.ib.done:before{display:none}
.ib.done svg{animation:lpop .45s var(--spring)}
#mglow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .7s ease;mix-blend-mode:screen;overflow:hidden}
#mglow i,#mglow b{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
#mglow i{width:560px;height:560px;margin:-280px 0 0 -280px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 19%,transparent),color-mix(in srgb,var(--acc2) 6%,transparent) 45%,transparent 70%);filter:blur(30px)}
#mglow b{width:150px;height:150px;margin:-75px 0 0 -75px;background:radial-gradient(circle,color-mix(in srgb,var(--acc2) 22%,transparent),transparent 70%);filter:blur(14px)}
.lite #mglow{display:none}
@media(max-width:560px){.ddm{right:auto;left:0;transform-origin:10% 0}.ddw{flex:1 1 auto}.dd{width:100%;justify-content:space-between}}

/* ===== finishing touches ===== */
.play:after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang),transparent 0 62%,rgba(255,255,255,.95) 82%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:lspin 2.6s linear infinite;pointer-events:none}

kbd{display:inline-block;min-width:22px;padding:2px 7px;border-radius:7px;border:1px solid var(--line);background:var(--surf3);font:700 11px/16px var(--display);color:var(--mu);text-align:center}

.cmdl b{font:600 15px var(--display)}.cmdl small{color:var(--mu);margin-left:auto;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}

.ov h2{font-size:22px}.ov p{color:var(--mu);margin:0;min-height:21px}

/* intro cutscene */

.lg{position:relative;width:150px;height:150px;display:grid;place-items:center}

@keyframes spin{to{transform:rotate(360deg)}}

.iskip{position:absolute!important;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.1em;padding:8px 12px;border-radius:10px}

.pav{width:34px;height:34px;border-radius:50%;image-rendering:pixelated;display:block}
.pn b{display:block;font-size:13px;line-height:1.15}.pn small{color:var(--mu);font-size:11px}
.px{image-rendering:pixelated;border-radius:14px;display:block}
.lg-ov{position:fixed;inset:0;z-index:90;display:none;padding:20px;background:rgba(4,4,10,.78);backdrop-filter:blur(20px);overflow-y:auto}
.lg-ov.show{display:flex;animation:fade .35s ease}
.lg-card{position:relative;width:min(780px,100%);margin:auto;background:var(--surf);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:28px;overflow:hidden;animation:lgpop .6s var(--spring)}
@keyframes lgpop{from{opacity:0;transform:translateY(30px) scale(.94)}}
.lg-card::before,.lg-card::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(60px);opacity:.32;pointer-events:none;animation:drift 9s ease-in-out infinite}

.stp{animation:rise .5s var(--out) both}
.lg-x{position:absolute!important;right:16px;top:16px;z-index:3;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--mu);transition:all .3s var(--spring)}

var lgov=document.getElementById('lgov'),lgc=document.getElementById('lgc'),lgTimer=null,msCode='',imgCache={};
function pad2(n){return n<10?'0'+n:''+n}
function head(name){
 if(imgCache[name])return imgCache[name];
 var h=0,i;for(i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
 function r(){h=(h*1664525+1013904223)>>>0;return h/4294967296}
 var skins=['#f1c9a5','#e0ac80','#c68863','#8d5a3b','#f8d9c0'],hairs=['#2b1d12','#6b4423','#d9a441','#1b1b2f','#a53f2b','#7c5cff'],eyes=['#3a6df0','#2f8f4e','#5a3b22'];
 var skin=skins[Math.floor(r()*5)],hair=hairs[Math.floor(r()*6)],eye=eyes[Math.floor(r()*3)];
 var c=document.createElement('canvas');c.width=c.height=8;var x=c.getContext('2d');
 x.fillStyle=skin;x.fillRect(0,0,8,8);
 x.fillStyle=hair;x.fillRect(0,0,8,2);
 for(i=0;i<4;i++)if(r()<.6){x.fillRect(i,2,1,1);x.fillRect(7-i,2,1,1)}
 x.fillStyle='#ffffff';x.fillRect(1,4,2,1);x.fillRect(5,4,2,1);
 x.fillStyle=eye;x.fillRect(2,4,1,1);x.fillRect(5,4,1,1);
 x.fillStyle='rgba(0,0,0,.28)';x.fillRect(3,6,2,1);
 return imgCache[name]=c.toDataURL();
}
function genCode(){var s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',o='';for(var i=0;i<8;i++)o+=s[Math.floor(Math.random()*s.length)];return o}

 finishLogin({t:'off',n:v});
}
function finishLogin(a){S.acct=a;save();updatePill();eyb();lg('done');setTimeout(function(){var r=lgc.getBoundingClientRect();burstAt(r.left+r.width/2,r.top+90)},350)}
function burstAt(cx,cy){
 var cols=[ACCS[S.acc][0],ACCS[S.acc][1],'#ffffff','#3ddc97'];
 for(var i=0;i<36;i++){var d=document.createElement('div');d.className='dot';d.style.left=cx+'px';d.style.top=cy+'px';d.style.background=cols[i%4];document.body.appendChild(d);
  var an=Math.random()*6.283,dist=90+Math.random()*150;
  d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(an)*dist+'px,'+Math.sin(an)*dist+'px) scale(0)',opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=(function(x){return function(){x.remove()}})(d);}
}
function copyCode(){
 var c=msCode.slice(0,4)+'-'+msCode.slice(4);
 try{navigator.clipboard.writeText(c).then(function(){toast('Code copied')},function(){toast('Select the code to copy it')})}catch(e){toast('Select the code to copy it')}
}
lgov.addEventListener('click',function(e){
 if(e.target===lgov){closeLogin();return}
 var t=e.target.closest('[data-lg]');if(!t)return;var a=t.dataset.lg;
 if(a=='close')closeLogin();
 else if(a=='ms'){msCode=genCode();lg('ms')}
 else if(a=='off')lg('off')
 else if(a=='back'||a=='switch')lg('choose')
 else if(a=='offgo')submitOffline();
 else if(a=='msgo')finishLogin({t:'ms',n:'ZenithPlayer'});
 else if(a=='copy')copyCode();
 else if(a=='out'){S.acct=null;save();updatePill();eyb();closeLogin();toast('Logged out')}
});
lgov.addEventListener('input',function(e){if(e.target.id=='lgn'){var av=document.getElementById('lgav');if(av)av.src=head(e.target.value.trim()||'Steve');document.getElementById('lge').textContent=''}});
lgov.addEventListener('keydown',function(e){if(e.key=='Enter'&&e.target.id=='lgn')submitOffline()});
document.addEventListener('keydown',function(e){if(e.key=='Escape'){if(lgov.classList.contains('show'))closeLogin();if(npov.classList.contains('show'))closeNew()}});
document.getElementById('accpill').addEventListener('click',function(){openLogin(S.acct?'acct':'choose')});
document.getElementById('nacct').addEventListener('click',function(){openLogin(S.acct?'acct':'choose')});
function boot(){render();if(!S.acct&&!S.seen){S.seen=1;save();setTimeout(function(){openLogin('choose')},1000)}}

/* intro cutscene */
function intro(done){
 var el=document.getElementById('intro');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!S.t[2]){el.remove();done();return}
 var cv=document.getElementById('ic'),ctx=cv.getContext('2d'),W,H,dpr=Math.min(2,window.devicePixelRatio||1);
 function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
 size();window.addEventListener('resize',size);
 var stars=[],maxD=Math.sqrt(W*W+H*H)/2+40;
 for(var i=0;i<230;i++)stars.push({a:Math.random()*6.283,d:Math.random()*maxD,s:.4+Math.random(),c:i%3==0?1:0});
 var steps=[['Game libraries',0],['Textures',.17],['Shaders',.34],['Fonts and sounds',.52],['Zenith HUD',.7],['Profile '+cur().v,.86]];
 var ia=document.getElementById('ia');ia.innerHTML=steps.map(function(s){return '<li><i></i>'+s[0]+'</li>'}).join('');
 var lis=ia.querySelectorAll('li'),ib=document.getElementById('ib'),it=document.getElementById('it'),ip=document.getElementById('ip');
 var dur=4800,t0=performance.now(),last=t0,p=0,fin=false,skip=false,acc=ACCS[S.acc];
 document.getElementById('isk').addEventListener('click',function(){skip=true});
 function finish(){
  fin=true;document.getElementById('flash').classList.add('go');
  setTimeout(function(){done();el.classList.add('out')},260);
  setTimeout(function(){el.remove();window.removeEventListener('resize',size)},1300);
 }
 function frame(n){
  var x=Math.min(1,(n-t0)/dur),dt=Math.min(50,n-last)/16.7;last=n;
  p=Math.max(p,x*x*(3-2*x));if(skip)p=Math.min(1,p+.06*dt);
  ib.style.width=(p*100)+'%';ip.textContent=Math.round(p*100)+'%';
  var cur=0;steps.forEach(function(s,k){if(p>=s[1])cur=k});
  lis.forEach(function(l,k){l.className=k<cur?'done':k==cur?(p>=1?'done':'on'):''});
  it.textContent=p>=1?'Ready':'Loading '+steps[cur][0].toLowerCase()+'…';
  var boost=.4+p*p*7;
  ctx.fillStyle='rgba(6,6,11,'+(.22+.1*(1-p))+')';ctx.fillRect(0,0,W,H);
  var cx=W/2,cy=H/2,gl=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.6);
  gl.addColorStop(0,acc[0]+'55');gl.addColorStop(1,acc[0]+'00');ctx.globalAlpha=.25+.55*p;ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  ctx.lineCap='round';
  stars.forEach(function(s){
   var pd=s.d;s.d+=(.5+s.d*.012*boost)*s.s*dt;
   if(s.d>maxD){s.d=Math.random()*30;s.a=Math.random()*6.283;pd=s.d}
   var ca=Math.cos(s.a),sa=Math.sin(s.a);
   ctx.strokeStyle=s.c?acc[1]:'#ffffff';ctx.globalAlpha=Math.min(1,s.d/260);ctx.lineWidth=.6+s.d/280;
   ctx.beginPath();ctx.moveTo(cx+ca*pd,cy+sa*pd);ctx.lineTo(cx+ca*s.d,cy+sa*s.d);ctx.stroke();
  });
  ctx.globalAlpha=1;
  if(p>=1&&!fin){finish();return}
  if(!fin)requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}
setAcc();updatePill();
intro(boot);
</script>
